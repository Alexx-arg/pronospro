[project]
name = "football-prediction-backend"
version = "0.1.0"
description = "FastAPI backend for football prediction app"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: tests que requieren Postgres real (testcontainers)"
]
testpaths = ["app/tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
