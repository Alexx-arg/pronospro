services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: ../.env
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - MODEL_PATH=/app/data/models/final/lightgbm_production.joblib
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Modelo montado externo, no dentro de la imagen (D10.3)
      - ../data/models/final:/app/data/models/final:ro
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
