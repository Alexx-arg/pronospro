# Alembic configuration file for the Football Prediction backend.
#
# Async engine is wired in backend/alembic/env.py. Database URL still
# accepts a sync version for tools (e.g. `alembic current`) that don't
# support an async driver: prepend `postgresql+psycopg://` if you want to
# run offline. By default we run online async via asyncpg.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The database URL. The env.py file OVERRIDES this at runtime with the
# value loaded from pydantic-settings (DATABASE_URL / POSTGRES_*). We
# provide a placeholder here so plain `alembic` invocations don't blow up
# before env.py runs.
sqlalchemy.url = driver://user:pass@host/db

# Logging: minimal config (env.py configures loguru itself).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
