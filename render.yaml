# =============================================================================
# Render Blueprint — deploy on Render.com
# Crea automaticamente: PostgreSQL (free tier) + Backend FastAPI (docker)
# =============================================================================

services:
  # --- Backend FastAPI ---
  - type: web
    name: football-prediction-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    healthCheckPath: /health
    plan: free                    # 512MB RAM, suspends after 15min sin uso
    autoDeploy: true
    # No 'startCommand' — el Dockerfile CMD escucha en $PORT (asignado por Render)
    envVars:
      # App
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
      - key: ADMIN_API_KEY
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

      # PostgreSQL (inyectado por Render — host en lugar de hostname)
      - key: DATABASE_URL
        fromDatabase:
          name: football-prediction-db
          property: connectionString
      - key: POSTGRES_HOST
        fromDatabase:
          name: football-prediction-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: football-prediction-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: football-prediction-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: football-prediction-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: football-prediction-db
          property: password

      # API-Football (rellena con tu key real de https://dashboard.api-football.com)
      - key: DATA_PROVIDER
        value: api_football
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: API_FOOTBALL_RATE_LIMIT_PER_MIN
        value: 30
      - key: API_FOOTBALL_RATE_LIMIT_PER_DAY
        value: 300

      # NVIDIA NIM (explicaciones IA)
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct

      # Scheduler (activar sync periodica despues)
      - key: SCHEDULER_ENABLED
        value: false
      - key: CURRENT_LEAGUES
        value: 39,140,61,135,78
      - key: CURRENT_SEASON_YEAR
        value: 2025

databases:
  - name: football-prediction-db
    databaseName: football
    user: football
    plan: free                  # 256MB, ~90 dias de vida en free